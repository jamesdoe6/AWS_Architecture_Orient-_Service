---
name: Formating Terraform Code
run-name: ${{github.actor}} is runing the workflow
on:
  push:
    branches:
      - main
env:
    TF_WORKDIR: './infra'
    TF_VERSION: '1.15.6'
jobs:
  format-terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
            terraform_version: ${{env.TF_VERSION}}
      - name: Format format Check
        run: make tf.fmt.ci
        continue-on-error: false
...
